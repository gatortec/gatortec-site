<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0171B9">
<title>Payment Received — GatorTec</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/site/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/img/site/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/img/site/apple-touch-icon.png">
<meta name="robots" content="noindex,follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css?v=5">
<link rel="stylesheet" href="../assets/css/base.css?v=5">
<style>
.receipt-wrap{max-width:560px;margin:0 auto;padding:48px 24px;text-align:center}
.receipt-icon{width:88px;height:88px;margin:0 auto 24px;border-radius:50%;background:#E7F5EA;display:flex;align-items:center;justify-content:center}
.receipt-icon svg{width:44px;height:44px;stroke:#1F6B33;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.receipt-h1{font-size:32px;font-weight:700;margin:0 0 12px;letter-spacing:-0.02em;color:#0f172a}
.receipt-body{font-size:16px;line-height:1.6;color:#374151;margin:0 0 20px}
.receipt-body strong{color:#0f172a}
.receipt-note{display:inline-block;font-size:13px;color:#6c757d;background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:10px 16px;margin:8px 0 28px}
.receipt-actions{margin-top:8px}
.receipt-actions a{color:var(--blue,#0171B9);text-decoration:none;font-weight:600;font-size:15px}
.receipt-actions a:hover{text-decoration:underline}
</style>
</head>
<body>
<header class="top"><div class="wrap">
<a class="brand" href="../" aria-label="GatorTec home">
  <img src="../assets/img/site/gatortec-mark.png" alt="" aria-hidden="true">
  <span>GatorTec</span>
</a>
</div></header>

<main id="main">
  <div class="receipt-wrap">
    <div class="receipt-icon" role="img" aria-label="Success">
      <svg viewBox="0 0 24 24"><path d="M5 12l4.5 4.5L20 6"/></svg>
    </div>
    <h1 class="receipt-h1">Payment Received</h1>
    <p class="receipt-body">Thank you! Your payment<span id="inv-line"></span> has been received. You'll get a paid invoice PDF via email shortly.</p>
    <p class="receipt-note">ACH payments typically settle in 3–5 business days.</p>
    <p class="receipt-body" style="font-size:14px;color:#6c757d;margin-bottom:0">Questions? Email <a href="mailto:billing@gatortec.com" style="color:var(--blue,#0171B9);font-weight:600">billing@gatortec.com</a> or call <a href="tel:+13525059088" style="color:var(--blue,#0171B9);font-weight:600">(352) 505-9088</a>.</p>
    <div class="receipt-actions" style="margin-top:32px">
      <a href="../">← Return to Homepage</a>
    </div>
  </div>
</main>

<script>
(function(){
  var m = location.search.match(/[?&]inv=([^&]+)/);
  if (m && m[1]) {
    var inv = decodeURIComponent(m[1]).replace(/[^A-Za-z0-9\-]/g,'');
    if (inv) document.getElementById('inv-line').textContent = ' for Invoice #' + inv;
  }
})();
</script>
</body>
</html>
